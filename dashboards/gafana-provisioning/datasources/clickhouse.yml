apiVersion: 1
datasources:
  - name: ClickHouse
    uid: clickhouse-market
    type: grafana-clickhouse-datasource
    access: proxy
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      defaultDatabase: default
      defaultTable: market_bars
      username: market_reader
    secureJsonData:
      password: ${CLICKHOUSE_READER_PASSWORD}